name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Run the suite
        run: dev/tests/run-tests.sh

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint POSIX shell
        run: shellcheck -S error src/scripts/*.sh dev/tests/*.sh

  # `shell:` takes no expression, so the two shells are separate jobs rather
  # than a matrix leg. Keep the two run blocks identical.
  powershell-pwsh:
    name: powershell parse (pwsh)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Parse the PowerShell scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem src/scripts -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
            Write-Host "ok $($_.Name)"
          }

  powershell-desktop:
    name: powershell parse (powershell)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Parse the PowerShell scripts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem src/scripts -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
            Write-Host "ok $($_.Name)"
          }
