name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify the suite passes at this tag
        run: dev/tests/run-tests.sh

      - name: Build the distributable skill bundle
        run: |
          set -eu
          version="${GITHUB_REF_NAME:-${{ inputs.tag }}}"
          # The repository has no dist/ directory; build in the runner's temp space.
          staging="$RUNNER_TEMP/chromeagent-skill"
          mkdir -p "$staging"
          cp -R src/. "$staging/"
          cp README.md LICENSE SECURITY.md "$staging/"
          (cd "$RUNNER_TEMP" && zip -qr "chromeagent-skill-${version}.zip" chromeagent-skill)
          ls -l "$RUNNER_TEMP"

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ runner.temp }}/*.zip
