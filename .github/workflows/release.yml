name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # A manual run names its tag; a tag push carries it in the ref. Pass it
      # through the environment so the value is data, never shell source.
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Without this a manual run would build the default branch, not the tag.
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Verify the suite passes at this tag
        run: dev/tests/run-tests.sh

      - name: Build the distributable skill bundle
        run: |
          set -eu
          version="$RELEASE_TAG"
          # The repository has no dist/ directory; build in the runner's temp space.
          staging="$RUNNER_TEMP/chromeagent-skill"
          mkdir -p "$staging"
          cp -R skills/chromeagent/. "$staging/"
          cp README.md LICENSE SECURITY.md "$staging/"
          (cd "$RUNNER_TEMP" && zip -qr "chromeagent-skill-${version}.zip" chromeagent-skill)
          ls -l "$RUNNER_TEMP"

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: ${{ runner.temp }}/*.zip
