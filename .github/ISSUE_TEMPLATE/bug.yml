name: Bug report
description: Something in the skill, the preflight, or the MCP setup does not work.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Run `src/scripts/preflight.sh` (or `src/scripts/preflight.ps1`) first and paste its output below —
        it reports the port and profile it actually used, which answers most questions up front.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you ran, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: preflight
    attributes:
      label: Preflight output
      render: text
    validations:
      required: true
  - type: input
    id: chrome
    attributes:
      label: Chrome version
      placeholder: "144.0.7444.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows (pwsh 7)
        - Windows (PowerShell 5.1)
        - WSL
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Coding agent
      placeholder: "Claude Code, Codex CLI, Cursor, ..."
